<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Task本部</title>
    <meta name="apple-mobile-web-app-title" content="Task本部" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Paint the chosen theme on the very first frame (dark unless light was picked on this device).
      try { if (localStorage.getItem('ft.theme.v1') === 'light') document.documentElement.className = 'light'; } catch (e) {}
    </script>
    <!-- Critical CSS: the background and a full-screen skeleton of the layout paint before any JS. -->
    <style>
      html, body { margin: 0; min-height: 100%; background: #0a0a0a; }
      html.light, html.light body { background: #f2f2f2; }
      #boot { position: fixed; inset: 0; z-index: 50; display: flex; gap: 20px; max-width: 1480px; margin: 0 auto; padding: 22px 24px; box-sizing: border-box; transition: opacity 0.35s ease; }
      #boot .col { display: flex; flex-direction: column; gap: 14px; }
      #boot .side { width: 300px; flex: none; }
      #boot .main { flex: 1; min-width: 0; }
      #boot .sk { border-radius: 18px; background: linear-gradient(100deg, rgba(255, 255, 255, 0.04) 30%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.04) 70%);
        background-size: 300% 100%; animation: shimmer 1.4s ease-in-out infinite; }
      html.light #boot .sk { background-image: linear-gradient(100deg, rgba(0, 0, 0, 0.04) 30%, rgba(0, 0, 0, 0.08) 50%, rgba(0, 0, 0, 0.04) 70%); }
      @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
      @media (max-width: 760px) { #boot { flex-direction: column; padding: 16px; } #boot .side { width: auto; } #boot .side .tall { display: none; } }
      @media (prefers-reduced-motion: reduce) { #boot .sk { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" data-testid="boot-skeleton" aria-hidden="true">
      <div class="col side">
        <div class="sk" style="height: 34px; width: 120px"></div>
        <div class="sk tall" style="height: 300px"></div>
        <div class="sk" style="height: 92px"></div>
        <div class="sk" style="height: 92px"></div>
      </div>
      <div class="col main">
        <div class="sk" style="height: 52px; width: 260px"></div>
        <div class="sk" style="height: 280px"></div>
        <div class="sk" style="height: 320px"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
